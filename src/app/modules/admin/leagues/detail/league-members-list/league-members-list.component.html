<div class="p-6 lg:p-8">
    <div class="flex flex-col sm:flex-row items-center justify-between">
        <div class="text-2xl font-semibold leading-tight">League Members</div>
        <button mat-flat-button [color]="'primary'" class="mt-4 sm:mt-0" (click)="loadLeagueMembers()">
            <mat-icon [svgIcon]="'heroicons_outline:refresh'"></mat-icon>
            <span class="ml-2">Refresh Members</span>
        </button>
    </div>

    <div class="overflow-x-auto mt-6">
        <table mat-table [dataSource]="dataSource">
            <!-- ID Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="Name">
                <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let element"> {{element.Name}} </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="Email">
                <th mat-header-cell *matHeaderCellDef> Email </th>
                <td mat-cell *matCellDef="let element"> {{element.Email}} </td>
            </ng-container>

            <!-- Handicap Column -->
            <ng-container matColumnDef="Handicap">
                <th mat-header-cell *matHeaderCellDef> Handicap </th>
                <td mat-cell *matCellDef="let element"> {{element.Handicap}} </td>
            </ng-container>

            <!-- Category Column -->
            <ng-container matColumnDef="Category">
                <th mat-header-cell *matHeaderCellDef> Category </th>
                <td mat-cell *matCellDef="let element"> {{element.Category}} </td>
            </ng-container>
            <!-- Need to make entire row clicbale and map to user to view profile -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="cursor-pointer hover:bg-gray-100" (click)="viewUserProfile(row.id)"></tr>
        </table>

        <div *ngIf="isLoading" class="flex justify-center items-center h-32">
            <mat-spinner [diameter]="40"></mat-spinner>
        </div>
        <div *ngIf="!isLoading && dataSource?.data?.length === 0" class="p-4 text-center text-secondary">
            No members found for this league.
        </div>
    </div>
</div>
