

<main class="flex-1 flex flex-col h-screen bg-[#f3f4f6] text-gray-800 overflow-y-auto">
    <div class="p-6 md:px-20  md:py-8 flex-1">

        <!-- Top Header -->
        <div
            class="flex flex-col text-white bg-[#175f9d] p-4 rounded-lg sm:flex-row justify-between items-start sm:items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold text-white"> {{ tour?.name }}

                </h1>
                <!-- <p class="text-sm text-white gap-1 flex items-center mt-1">
                    <mat-icon class="icon-size-5 text-white" [svgIcon]="'heroicons_solid:bell'"></mat-icon>
                    {{
                    tour?.startDate
                    |date
                    }} - {{
                    tour?.endDate |date
                    }}
                </p> -->
            </div>

        </div>



        <!-- Stats Cards -->
        <div class="flex flex-col sm:flex-row gap-6 mb-8">
            <div class="bg-white p-4 rounded-lg w-full shadow-sm flex items-center space-x-4 border border-gray-200">

                <div class="flex-shrink-0 h-10 w-10 rounded-full flex items-center justify-center bg-teal-200">
                    <mat-icon class="icon-size-5  text-teal-600" [svgIcon]="'heroicons_outline:user-group'"></mat-icon>
                </div>

                <div>
                    <p class="text-sm font-medium text-gray-500"> Total Members</p>
                    <p class="text-2xl font-bold text-gray-900"> {{ tour?.members?.length || 0 }}</p>
                    <!-- @if (date()) {
                    <p class="text-xs text-gray-400 mt-1">
                        Date: {{ date() }}
                    </p>
                    } -->
                </div>
            </div>
            <div class="bg-white w-full p-4 rounded-lg shadow-sm flex items-center space-x-4 border border-gray-200">

                <div class="flex-shrink-0 h-10 w-10 rounded-full flex items-center justify-center bg-blue-200">
                    <mat-icon class="icon-size-5  text-blue-600" [svgIcon]="'heroicons_outline:user'"></mat-icon>
                </div>

                <div>
                    <p class="text-sm font-medium text-gray-500"> Total Tournaments</p>
                    <p class="text-2xl font-bold text-gray-900"> {{ tour?.tournaments?.length || 0 }}</p>





                </div>
            </div>
            <div class="bg-white w-full p-5 rounded-lg shadow-sm flex items-center space-x-4 border border-gray-200">

                <div class="flex-shrink-0 h-12 w-12 rounded-full flex items-center justify-center bg-red-200">
                    <mat-icon class="icon-size-5  text-red-600" [svgIcon]="'heroicons_outline:user'"></mat-icon>
                </div>

                <div>
                    <p class="text-sm font-medium text-gray-500"> League Description</p>
                    <p class="text-2xl font-bold text-gray-900">{{ tour?.description || 'No description available.' }}
                    </p>
                </div>
            </div>


        </div>


        <!-- Tabs -->
        <div class="my-4">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-6" aria-label="Tabs">

                    <button *ngFor="let tab of tabs" (click)="setPrimaryTab(tab)" [ngClass]="
          activePrimaryTab === tab
            ? 'border-emerald-500 text-emerald-600'
            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
        " class="whitespace-nowrap py-3 px-1 border-b-2 font-semibold text-lg transition-colors focus:outline-none">
                        {{ tab }}
                    </button>

                </nav>
            </div>
        </div>

        <div *ngIf="activePrimaryTab === 'Members'">
            <app-league-members-list [leagueId]="leagueId"></app-league-members-list>
        </div>

        <div *ngIf="activePrimaryTab === 'Tournaments'">
            <app-league-tournaments-list [leagueId]="leagueId"></app-league-tournaments-list>
        </div>

    </div>
</main>
