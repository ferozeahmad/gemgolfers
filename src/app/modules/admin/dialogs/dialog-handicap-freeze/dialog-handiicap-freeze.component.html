<div class="flex flex-col max-w-240 md:min-w-120 max-h-screen ">

    <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-primary text-on-primary">
        <div class="text-lg font-medium">Player Handicap Freeze</div>
        <button mat-icon-button (click)="onNoClick()" [tabIndex]="-1">
            <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>
    <div class="flex flex-col gap-4 p-4 w-full" [formGroup]="form">
        <mat-form-field class="fuse-mat-no-subscript w-full">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startDatePicker" formControlName="startDate">
            <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #startDatePicker></mat-datepicker>
        </mat-form-field>
        <mat-form-field class="fuse-mat-no-subscript w-full">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endDatePicker" formControlName="endDate">
            <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #endDatePicker></mat-datepicker>
        </mat-form-field>

    </div>

    <div class="flex justify-center p-4">
        <button type="button" mat-raised-button color="warn" (click)="onNoClick()">
            Cancel
        </button>
        <button class="mx-2" mat-raised-button color="primary" (click)="changeTee()" cdkFocusInitial>
            Freeze
        </button>

    </div>
</div>
