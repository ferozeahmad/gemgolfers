<h2 mat-dialog-title>Set Passwords for Selected Players</h2>

<mat-dialog-content class="mat-typography">
    <div *ngIf="isLoading" class="flex items-center justify-center py-10">
        <mat-spinner [diameter]="30"></mat-spinner>
    </div>

    <form [formGroup]="passwordForm" *ngIf="!isLoading">
        <div class="mat-elevation-z8">
            <table mat-table [dataSource]="usersWithPasswords">

                <!-- Name Column -->
                <ng-container matColumnDef="Name">
                    <th mat-header-cell *matHeaderCellDef> Player Name </th>
                    <td mat-cell *matCellDef="let element"> {{ element.Name | uppercase }} </td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="Email">
                    <th mat-header-cell *matHeaderCellDef> Email </th>
                    <td mat-cell *matCellDef="let element"> {{ element.Email }} </td>
                </ng-container>

                <!-- Password Input Column -->
                <ng-container matColumnDef="passwordInput">
                    <th mat-header-cell *matHeaderCellDef>Password </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-form-field appearance="outline" class="w-full pt-4">
                            <input matInput [formControl]="element.passwordControl" [type]='showPasswordField'
                                placeholder="Enter password" required>
                            <mat-error *ngIf="element.passwordControl.hasError('required')">Password is
                                required</mat-error>
                            <mat-error *ngIf="element.passwordControl.hasError('minlength')">Minimum 6
                                characters</mat-error>
                            <button mat-icon-button type="button" (click)="
                                    showPasswordField === 'password'
                                        ? (showPasswordField = 'text')
                                        : (showPasswordField = 'password')
                                " matSuffix>
                                <mat-icon class="icon-size-5" *ngIf="showPasswordField === 'password'"
                                    [svgIcon]="'heroicons_solid:eye'"></mat-icon>
                                <mat-icon class="icon-size-5" *ngIf="showPasswordField === 'text'"
                                    [svgIcon]="'heroicons_solid:eye-off'"></mat-icon>
                            </button>
                        </mat-form-field>
                    </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Status </th>
                    <td mat-cell *matCellDef="let element">
                        <span class="status-pill" [ngClass]="{
                'bg-green-100 text-green-800': element.status === 'success',
                'bg-red-100 text-red-800': element.status === 'error',
                'bg-blue-100 text-blue-800': element.status === 'pending'
              }">
                            {{ element.status | uppercase }}<span *ngIf="element.message"> {{ element.message }}</span>
                        </span>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="['Name', 'Email', 'passwordInput', 'status']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['Name', 'Email', 'passwordInput', 'status'];"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" [attr.colspan]="4">No players selected.</td>
                </tr>
            </table>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onClose()">Close</button>
    <button mat-flat-button color="primary" (click)="savePasswords()"
        [disabled]="passwordForm.invalid || isLoading">Save Passwords</button>
</mat-dialog-actions>
