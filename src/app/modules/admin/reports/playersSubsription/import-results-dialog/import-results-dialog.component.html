<h2 mat-dialog-title>Bulk Import Results</h2>

<mat-dialog-content class="mat-typography">
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="data">

      <!-- Row Column -->
      <ng-container matColumnDef="row">
        <th mat-header-cell *matHeaderCellDef> Row </th>
        <td mat-cell *matCellDef="let element"> {{ element.row }} </td>
      </ng-container>

      <!-- Membership Number Column -->
      <ng-container matColumnDef="membershipNumber">
        <th mat-header-cell *matHeaderCellDef> Membership # </th>
        <td mat-cell *matCellDef="let element"> {{ element.membershipNumber }} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element">
          <span class="status-pill " [ngClass]="element.status === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
            {{ element.status | uppercase }}
          </span>
        </td>
      </ng-container>

      <!-- Message Column -->
      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef> Message </th>
        <td mat-cell *matCellDef="let element"> {{ element.message }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No import results to display.</td>
      </tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">Close</button>
</mat-dialog-actions>
