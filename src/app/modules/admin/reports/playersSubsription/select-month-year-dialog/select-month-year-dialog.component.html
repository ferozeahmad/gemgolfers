<h2 mat-dialog-title class="text-xl font-bold">Select Subscription Month & Year</h2>

<mat-dialog-content class="mat-typography py-4">
  <p class="text-secondary mb-4 text-sm">
    Please select the month and year for which you want to import the subscriptions. 
    The due date will be set to the last day of the selected month.
  </p>

  <div class="flex flex-col sm:flex-row gap-4">
    <!-- Month Selection -->
    <mat-form-field class="w-full sm:w-1/2">
      <mat-label>Subscription Month</mat-label>
      <mat-select [(value)]="selectedMonth">
        <mat-option *ngFor="let month of months" [value]="month.value">
          {{ month.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Year Selection -->
    <mat-form-field class="w-full sm:w-1/2">
      <mat-label>Subscription Year</mat-label>
      <mat-select [(value)]="selectedYear">
        <mat-option *ngFor="let year of years" [value]="year">
          {{ year }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="gap-2">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()">Proceed</button>
</mat-dialog-actions>
