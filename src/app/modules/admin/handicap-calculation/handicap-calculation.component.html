<div class="flex-auto">
    <div
        class="flex flex-row bg-card sm:flex-row md:flex-row flex-auto justify-between py-8 px-6 md:px-8 border-b"
    >
        <div>
            <div class="text-6xl font-extrabold tracking-tight leading-none mt-3">
                Handicap Calculation
            </div>
        </div>
        <div class="mt-3">
            <button
                class="mx-1"
                (click)="calculateHandicapCONGU()"
                mat-raised-button
                color="warn"
            >
                Re-Calculate Handicap CONGU
            </button>
            <button
                class="mx-1"
                (click)="calculateHandicapWHS()"
                mat-raised-button
                color="warn"
            >
                Re-Calculate Handicap WHS
            </button>
        </div>
    </div>

    <div class="p-8">
        <div class="flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
            <div class="flex items-center mb-4">
                <mat-form-field class="w-full max-w-sm">
                    <input
                        matInput
                        (keyup)="applyFilter($event.target.value)"
                        placeholder="Filter"
                    />
                    <mat-icon matPrefix>search</mat-icon>
                </mat-form-field>
            </div>

            <table mat-table [dataSource]="dataSource" matSort>
                <!-- Select Column -->
                <ng-container matColumnDef="select">
                    <th mat-header-cell *matHeaderCellDef>Select</th>
                    <td mat-cell *matCellDef="let row" class="text-center">
                        <mat-radio-button
                            (click)="$event.stopPropagation()"
                            (change)="selection.select(row)"
                            [checked]="selection.isSelected(row)"
                        ></mat-radio-button>
                    </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="Name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                    <td mat-cell *matCellDef="let element">{{ element.Name }}</td>
                </ng-container>

                <!-- Phone Column -->
                <ng-container matColumnDef="Phone">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.Phone ? element.Phone : '-' }}
                    </td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="Email">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.Email ? element.Email : '-' }}
                    </td>
                </ng-container>

                <!-- Membership Column -->
                <ng-container matColumnDef="Membership">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>MembershipNo</th>
                    <td mat-cell *matCellDef="let element" class="text-center">
                        {{ element.Membership ? element.Membership : '-' }}
                    </td>
                </ng-container>

                <!-- Handicap Column -->
                <ng-container matColumnDef="Handicap">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Handicap</th>
                    <td mat-cell *matCellDef="let element" class="text-center">
                        {{ element.Handicap }}
                    </td>
                </ng-container>

                <!-- Club Column -->
                <ng-container matColumnDef="Club">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Club</th>
                    <td mat-cell *matCellDef="let element">{{ element.Club }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns"
                    (click)="selection.select(row)"
                    class="cursor-pointer"
                ></tr>
            </table>

            <mat-paginator
                [length]="totalPlayers"
                [pageIndex]="pageIndex"
                [pageSize]="pageSize"
                [pageSizeOptions]="[10, 20, 50, 100]"
                (page)="onPageChange($event)"
            ></mat-paginator>
        </div>
    </div>
</div>
